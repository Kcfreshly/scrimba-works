<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search & Notify Bot</title>
    <style>
        body { font-family: sans-serif; margin: 2em; background-color: #f4f4f9; }
        #app-container { max-width: 800px; margin: 0 auto; background: #fff; padding: 2em; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        #search-controls { display: flex; gap: 10px; }
        #search-query { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        #search-button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #search-button:disabled { background-color: #ccc; }
        #results-container { border: 1px solid #eee; padding: 1em; margin-top: 1em; min-height: 100px; border-radius: 4px; }
        .result-item { border-bottom: 1px solid #f0f0f0; padding: 0.8em 0; }
        .result-item:last-child { border-bottom: none; }
        .status { font-style: italic; color: #555; }
    </style>
</head>
<body>
    <div id="app-container">
        <h1>Search & Notify Bot</h1>
        <div id="search-controls">
            <input type="text" id="search-query" placeholder="e.g., agent" value="agent"/>
            <button id="search-button">Search</button>
        </div>
        <h3>Results:</h3>
        <div id="results-container">
            <p class="status">Enter a query and click search to begin.</p>
        </div>
    </div>

    <!-- Link to the external JavaScript file -->
    <script src="main.js"></script>
</body>
</html>
