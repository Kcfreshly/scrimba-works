<html>
    <head>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Source+Sans+Pro:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <header>
            <img class="logo" src="images/logo.png" alt="Instagram Logo">
            <img class="user-avatar" src="images/user-avatar.png" alt="User Avatar">
        </header>

        <main>
            <section class="user-profile">
                <img class="avatar" src="images/avatar-vangogh.jpg" alt="User Avatar">
                <div class="story-ring">
                    <p class="username">Vincent van Gogh</p>
                    <p class="address">Zundert, Netherlands</p>
                </div>
            </section>

            <section class="posts">
                <img class="post-image" src="images/post-vangogh.jpg" alt="Post Image">
            </section>


            <section class="likes-icons">
                <div class="icons-clusters">
                    <img class="icon" src="images/icon-heart.png" alt="Heart Icon">
                    <img class="icon" src="images/icon-comment.png" alt="Comment Icon">
                    <img class="icon" src="images/icon-dm.png" alt="Share Icon">
                </div>
                <div class="likes"><p>1,234 likes</p></div>
                
            </section>

            <section class="comments">
                <div>
                    <p><span class="username">vincey1853</span> just took a few mushrooms lol.</p>
                </div>
            </section>
        </main>

        <script src="index.js"></script>
    </body>
</html>
